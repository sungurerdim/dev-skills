name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Consistency gate
        run: bash scripts/check-consistency.sh
      - name: Consistency gate self-test (BP-007 — proves checks catch broken input)
        run: bash scripts/check-consistency.sh --self-test
