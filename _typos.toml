# typos allowlist — every entry is domain vocabulary checked at its call site; nothing is suppressed blind.

[default.extend-words]
# Rule prefixes and acronyms
ASO = "ASO"                 # App Store Optimization
aso = "aso"
THM = "THM"                 # theming rule prefix (core/rules/ui-design-system.md)
PN = "PN"                   # inside "PNGs"

# Technology and product names
BRIN = "BRIN"               # Postgres Block Range INdex
brin = "brin"
Hashi = "Hashi"             # HashiCorp
Frase = "Frase"             # Frase.io
Wonderous = "Wonderous"     # Google's Flutter showcase app
Canva = "Canva"
testng = "testng"           # TestNG dependency name (core/toolchains.md)
ratatui = "ratatui"         # Rust TUI crate (core/ds_detect.py)

# English usages typos mis-reads
mis = "mis"                 # mis-copied, mis-priced
criticals = "criticals"
ontext = "ontext"           # **C**ontext
equirements = "equirements" # **R**equirements
